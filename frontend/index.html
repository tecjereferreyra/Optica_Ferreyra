<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Óptica La Mirada - Pedidos de anteojos">
    <meta name="keywords" content="Óptica, anteojos, pedidos, armazones, cristales">
    <meta name="author" content="Jeremías Ferreyra">
    <title>Óptica La Mirada</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header class="encabezado">
        <h1>Óptica La Mirada</h1>
        <p>Pedidos de anteojos</p>
    </header>

    <main class="principal">
        <!-- ================= Nuevo pedido ================= -->
        <section class="seccion">
            <h2>Registrar pedido</h2>

            <form id="formPedido">
                <label for="cliente">Cliente</label>
                <input type="text" id="cliente" maxlength="80"
                    placeholder="Ej: Elsa Domínguez" required>

                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" maxlength="20"
                    placeholder="Ej: 3573-410233">

                <label for="armazon">Armazón</label>
                <select id="armazon" required>
                    <option value="">Cargando armazones...</option>
                </select>

                <label for="cristal">Tipo de cristal</label>
                <select id="cristal" required>
                    <option value="Monofocal">Monofocal</option>
                    <option value="Bifocal">Bifocal</option>
                    <option value="Progresivo">Progresivo</option>
                    <option value="Sol">Sol</option>
                </select>

                <label for="precio">Precio total ($)</label>
                <input type="number" id="precio" min="1" step="0.01"
                    placeholder="Ej: 185000" required>

                <button type="submit" class="btn btn-principal">Registrar pedido</button>
            </form>

            <p id="mensajeForm" class="mensaje"></p>
        
        </section>

        <!-- ================= Pedidos ================= -->
        <section class="seccion ancha">
            <h2>Pedidos</h2>
            <p id="mensajeLista" class="mensaje"></p>

            <table class="tabla">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Cliente</th>
                        <th>Armazón</th>
                        <th>Cristal</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoPedidos">
                    <tr><td colspan="7">Cargando pedidos...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="pie">
        Programación II · Instituto Superior Villa del Rosario · 2026
    </footer>

    <script src="app.js"></script>
</body>
</html>
